<script>
(function(){
 var D=JSON.parse(document.getElementById('niucipher').textContent);
 var pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err');
 function unlock(){
  if(typeof CryptoJS==='undefined'){ err.textContent='Could not load the crypto library — check your connection.'; return; }
  if(!pw.value){ return; }
  go.disabled=true; go.textContent='Decrypting…'; err.textContent='';
  setTimeout(function(){
   try{
    var salt=CryptoJS.enc.Hex.parse(D.s), iv=CryptoJS.enc.Hex.parse(D.iv);
    var key=CryptoJS.PBKDF2(pw.value,salt,{keySize:8,iterations:D.it,hasher:CryptoJS.algo.SHA256});
    var pt=CryptoJS.AES.decrypt({ciphertext:CryptoJS.enc.Base64.parse(D.ct)},key,{iv:iv,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7});
    var txt=pt.toString(CryptoJS.enc.Utf8);
    if(txt.indexOf(D.sn)!==0){ throw new Error('bad'); }
    var html=txt.slice(D.sn.length);
    document.open(); document.write(html); document.close();
   }catch(e){ go.disabled=false; go.textContent='Unlock'; err.textContent='Wrong passphrase — try again.'; pw.value=''; pw.focus(); }
  },30);
 }
 go.onclick=unlock;
 pw.addEventListener('keydown',function(e){ if(e.key==='Enter') unlock(); });
})();
</script>
